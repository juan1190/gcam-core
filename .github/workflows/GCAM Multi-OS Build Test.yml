name: GCAM Multi-OS Build Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCAM_VERSION: v9.1
  JARS_VERSION: v5.4

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record start time
        id: start
        shell: bash
        run: echo "start_ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ---------- Jars (all OSes, cached) ----------
      - name: Cache jars
        id: cache-jars
        uses: actions/cache@v4
        with:
          path: ~/gcam-libs/jars
          key: gcam-jars-${{ env.JARS_VERSION }}

      - name: Download jars
        if: steps.cache-jars.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fL -o jars.zip https://github.com/JGCRI/modelinterface/releases/download/${{ env.JARS_VERSION }}/jars.zip
          unzip -q jars.zip -d "$HOME/gcam-libs"
          rm jars.zip

      - name: Set JARS_LIB
        shell: bash
        run: echo "JARS_LIB=$HOME/gcam-libs/jars/*" >> "$GITHUB_ENV"

      # ---------- Linux ----------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
            libboost-dev \
            libeigen3-dev libtbb-dev openjdk-17-jdk

          JH=$(dirname $(dirname $(readlink -f $(which javac))))
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "JAVA_INCLUDE=$JH/include" >> "$GITHUB_ENV"
          echo "JAVA_LIB=$JH/lib/server" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDE=/usr/include" >> "$GITHUB_ENV"
          echo "BOOST_LIB=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "EIGEN_INCLUDE=/usr/include/eigen3" >> "$GITHUB_ENV"
          echo "TBB_INCLUDE=/usr/include" >> "$GITHUB_ENV"
          echo "TBB_LIB=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      # ---------- Builds ----------
      - name: Build GCAM (Linux)
        if: runner.os == 'Linux'
        id: build-linux
        shell: bash
        run: |
          set -eo pipefail
          BUILD_START=$(date +%s)
          cd cvs/objects/build/linux
          make gcam -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          BUILD_END=$(date +%s)
          echo "build_seconds=$((BUILD_END - BUILD_START))" >> "$GITHUB_OUTPUT"

      - name: Verify executable
        shell: bash
        run: |
          ls exe/ || true
          test -f exe/gcam.exe && echo "Build artifact found"

      - name: Upload executable (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gcam-exe-${{ github.run_number }}
          path: exe/
          retention-days: 14

      - name: Collect metrics
        if: always()
        shell: bash
        run: |
          END_TS=$(date +%s)
          TOTAL=$((END_TS - ${{ steps.start.outputs.start_ts }}))
          BUILD_SECS=${{ steps.build-linux.outputs.build_seconds || steps.build-macos.outputs.build_seconds || steps.build-win.outputs.build_seconds || 0 }}
          BINARY_SIZE=$(stat -c %s exe/gcam.exe 2>/dev/null || stat -f %z exe/gcam.exe 2>/dev/null || echo 0)
          WARNINGS=$(grep -ci "warning" build.log 2>/dev/null || echo 0)

          cat > metrics.json <<EOF
          {
            "os": "${{ matrix.os }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "date_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "total_workflow_seconds": $TOTAL,
            "build_seconds": $BUILD_SECS,
            "binary_size_bytes": $BINARY_SIZE,
            "compiler_warnings": $WARNINGS
          }
          EOF
          cat metrics.json

          {
            echo "### GCAM Build Metrics (${{ matrix.os }})"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Build time | ${BUILD_SECS}s |"
            echo "| Total time | ${TOTAL}s |"
            echo "| Binary size | ${BINARY_SIZE} bytes |"
            echo "| Warnings | ${WARNINGS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcam-metrics-${{ matrix.os }}-${{ github.run_number }}
          path: |
            metrics.json
            build.log
          retention-days: 90
