name: GCAM Multi-OS Build Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCAM_VERSION: v9.1        # release whose libs the Mac/Windows legs use
  JARS_VERSION: v5.4        # modelinterface jars release (Linux)

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record start time
        id: start
        shell: bash
        run: echo "start_ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ---------- Linux: jars (Mac/Win get jars inside release libs) ----------
      - name: Cache jars (Linux)
        if: runner.os == 'Linux'
        id: cache-jars
        uses: actions/cache@v4
        with:
          path: ~/gcam-libs/jars
          key: gcam-jars-${{ env.JARS_VERSION }}

      - name: Download jars (Linux)
        if: runner.os == 'Linux' && steps.cache-jars.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -L -o jars.zip https://github.com/JGCRI/modelinterface/releases/download/${{ env.JARS_VERSION }}/jars.zip
          unzip -q jars.zip -d "$HOME/gcam-libs"
          rm jars.zip

      - name: Set JARS_LIB (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "JARS_LIB=$HOME/gcam-libs/jars/*" >> "$GITHUB_ENV"

      # ---------- macOS + Windows: cached release-package libs ----------
      - name: Cache GCAM libs
        if: runner.os != 'Linux'
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: libs
          key: gcam-libs-${{ runner.os }}-${{ env.GCAM_VERSION }}

      - name: Validate cached libs
        if: runner.os != 'Linux'
        id: libs-check
        shell: bash
        run: |
          if [ -d libs ] && [ "$(ls -A libs)" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            rm -rf libs
          fi

      - name: Get GCAM libs (macOS)
        if: runner.os == 'macOS' && steps.libs-check.outputs.valid != 'true'
        shell: bash
        run: |
          curl -L -o release.zip \
            https://github.com/JGCRI/gcam-core/releases/download/gcam-${{ env.GCAM_VERSION }}/gcam-${{ env.GCAM_VERSION }}-Mac-Release-Package.zip
          # VERIFY layout once: unzip -l release.zip | head -20
          # If libs/ is wrapped in a root folder, adjust pattern + add a mv (see comments)
          unzip -q release.zip "libs/*" -d "$GITHUB_WORKSPACE"
          rm release.zip
          ls libs

      - name: Get GCAM libs (Windows)
        if: runner.os == 'Windows' && steps.libs-check.outputs.valid != 'true'
        shell: pwsh
        run: |
          # VERIFY the exact Windows asset filename on the release page
          curl.exe -L -o release.zip `
            https://github.com/JGCRI/gcam-core/releases/download/gcam-${{ env.GCAM_VERSION }}/gcam-${{ env.GCAM_VERSION }}-Windows-Release-Package.zip
          tar -xf release.zip "libs"
          Remove-Item release.zip
          Get-ChildItem libs

      # ---------- Per-OS toolchain / JDK setup ----------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
            libboost-dev libboost-filesystem-dev libboost-system-dev \
            libeigen3-dev libtbb-dev openjdk-17-jdk

          JH=$(dirname $(dirname $(readlink -f $(which javac))))
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "JAVA_INCLUDE=$JH/include" >> "$GITHUB_ENV"
          echo "JAVA_LIB=$JH/lib/server" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDE=/usr/include" >> "$GITHUB_ENV"
          echo "BOOST_LIB=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "EIGEN_INCLUDE=/usr/include/eigen3" >> "$GITHUB_ENV"
          echo "TBB_INCLUDE=/usr/include" >> "$GITHUB_ENV"
          echo "TBB_LIB=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Install JDK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask temurin@17
          JDK_HOME=$(/usr/libexec/java_home -v 17)
          echo "JAVA_HOME=$JDK_HOME" >> "$GITHUB_ENV"
          echo "JAVA_INCLUDE=$JDK_HOME/include" >> "$GITHUB_ENV"
          echo "JAVA_LIB=$JDK_HOME/lib/server" >> "$GITHUB_ENV"
          # If the release libs don't bundle Java, satisfy the project's libs/java expectation:
          [ -e libs/java ] || ln -sfn "$JDK_HOME" libs/java

      - name: Install JDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install temurin17 -y --no-progress
          $jdk = (Get-ChildItem "C:\Program Files\Eclipse Adoptium\jdk-17*" | Select-Object -First 1).FullName
          "JAVA_HOME=$jdk" >> $env:GITHUB_ENV
          "JAVA_INCLUDE=$jdk\include" >> $env:GITHUB_ENV
          "JAVA_LIB=$jdk\lib" >> $env:GITHUB_ENV
          if (-not (Test-Path libs\java)) { cmd /c mklink /J libs\java "$jdk" }

      - name: Set up MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      # ---------- Builds ----------
      - name: Build GCAM (Linux)
        if: runner.os == 'Linux'
        id: build-linux
        shell: bash
        run: |
          set -eo pipefail
          BUILD_START=$(date +%s)
          cd cvs/objects/build/linux
          make gcam -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          BUILD_END=$(date +%s)
          echo "build_seconds=$((BUILD_END - BUILD_START))" >> "$GITHUB_OUTPUT"

      - name: Build GCAM (macOS)
        if: runner.os == 'macOS'
        id: build-macos
        shell: bash
        run: |
          set -eo pipefail
          BUILD_START=$(date +%s)
          xcodebuild -project cvs/objects/build/xcode3/objects.xcodeproj \
            -configuration Release \
            build 2>&1 | tee build.log
          BUILD_END=$(date +%s)
          echo "build_seconds=$((BUILD_END - BUILD_START))" >> "$GITHUB_OUTPUT"

      - name: Build GCAM (Windows)
        if: runner.os == 'Windows'
        id: build-win
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $start = Get-Date
          # VERIFY the .sln filename inside vc10
          msbuild cvs\objects\build\vc10\objects.sln `
            /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /m `
            | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $seconds = [int]((Get-Date) - $start).TotalSeconds
          "build_seconds=$seconds" >> $env:GITHUB_OUTPUT

      - name: Verify executable
        shell: bash
        run: |
          ls exe/ || true
          test -f exe/gcam.exe && echo "Build artifact found"

      - name: Upload executable (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gcam-exe-${{ github.run_number }}
          path: exe/
          retention-days: 14

      # ---------- Metrics ----------
      - name: Collect metrics
        if: always()
        shell: bash
        run: |
          END_TS=$(date +%s)
          TOTAL=$((END_TS - ${{ steps.start.outputs.start_ts }}))
          BUILD_SECS=${{ steps.build-linux.outputs.build_seconds || steps.build-macos.outputs.build_seconds || steps.build-win.outputs.build_seconds || 0 }}
          BINARY_SIZE=$(stat -c %s exe/gcam.exe 2>/dev/null || stat -f %z exe/gcam.exe 2>/dev/null || echo 0)
          WARNINGS=$(grep -ci "warning" build.log 2>/dev/null || echo 0)

          cat > metrics.json <<EOF
          {
            "os": "${{ matrix.os }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "date_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "total_workflow_seconds": $TOTAL,
            "build_seconds": $BUILD_SECS,
            "binary_size_bytes": $BINARY_SIZE,
            "compiler_warnings": $WARNINGS
          }
          EOF
          cat metrics.json

          {
            echo "### GCAM Build Metrics (${{ matrix.os }})"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Build time | ${BUILD_SECS}s |"
            echo "| Total time | ${TOTAL}s |"
            echo "| Binary size | ${BINARY_SIZE} bytes |"
            echo "| Warnings | ${WARNINGS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcam-metrics-${{ matrix.os }}-${{ github.run_number }}
          path: |
            metrics.json
            build.log
          retention-days: 90
