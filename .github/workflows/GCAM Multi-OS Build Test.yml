name: GCAM Multi-OS Build Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCAM_VERSION: v9.1
  JARS_VERSION: v5.4

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record start time
        id: start
        shell: bash
        run: echo "start_ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ---------- Jars (all OSes, cached) ----------
      - name: Cache jars
        id: cache-jars
        uses: actions/cache@v4
        with:
          path: ~/gcam-libs/jars
          key: gcam-jars-${{ env.JARS_VERSION }}

      - name: Download jars
        if: steps.cache-jars.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fL -o jars.zip https://github.com/JGCRI/modelinterface/releases/download/${{ env.JARS_VERSION }}/jars.zip
          unzip -q jars.zip -d "$HOME/gcam-libs"
          rm jars.zip

      - name: Set JARS_LIB
        shell: bash
        run: echo "JARS_LIB=$HOME/gcam-libs/jars" >> "$GITHUB_ENV"

      # ---------- Linux dependencies ----------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
            libboost-dev libeigen3-dev libtbb-dev openjdk-17-jdk
          JH=$(dirname $(dirname $(readlink -f $(which javac))))
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "JAVA_INCLUDE=$JH/include" >> "$GITHUB_ENV"
          echo "JAVA_LIB=$JH/lib/server" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDE=/usr/include" >> "$GITHUB_ENV"
          echo "BOOST_LIB=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "EIGEN_INCLUDE=/usr/include/eigen3" >> "$GITHUB_ENV"
          echo "TBB_INCLUDE=/usr/include" >> "$GITHUB_ENV"
          echo "TBB_LIB=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      # ---------- macOS dependencies ----------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install boost eigen tbb
          brew install --cask temurin@17
          JDK_HOME=$(/usr/libexec/java_home -v 17)
          echo "JAVA_HOME=$JDK_HOME" >> "$GITHUB_ENV"

          mkdir -p libs/java

          # boost-lib must contain boost/ headers directly
          ln -sfn "$(brew --prefix boost)/include"        libs/boost-lib
          # eigen headers live directly under libs/eigen
          ln -sfn "$(brew --prefix eigen)/include/eigen3" libs/eigen
          # tbb must be the PREFIX: project uses libs/tbb/include and libs/tbb/lib
          ln -sfn "$(brew --prefix tbb)"                  libs/tbb
          ln -sfn "$JDK_HOME/include"                     libs/java/include
          ln -sfn "$JDK_HOME/lib/server"                  libs/java/lib
          ln -sfn "$HOME/gcam-libs/jars"                  libs/jars

          # sanity checks — fail early with a useful message
          test -f libs/tbb/include/tbb/tbb.h
          test -f libs/boost-lib/boost/version.hpp
          test -d libs/eigen/Eigen || ls libs/eigen
          test -f libs/java/include/jni.h

      - name: ccache (macOS)
        if: runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}

      # ---------- Windows dependencies ----------
      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Setup Java (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Windows libs
        if: runner.os == 'Windows'
        id: cache-winlibs
        uses: actions/cache@v4
        with:
          path: C:\gcam-libs
          key: gcam-winlibs-boost1.85-tbb2021.13-eigen3.4

      - name: Download & build libs (Windows)
        if: runner.os == 'Windows' && steps.cache-winlibs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\gcam-libs | Out-Null

          # ---- Boost (headers + system/filesystem compiled) ----
          curl.exe -fL -o boost.zip https://archives.boost.io/release/1.85.0/source/boost_1_85_0.zip
          Expand-Archive boost.zip -DestinationPath C:\gcam-libs
          Rename-Item C:\gcam-libs\boost_1_85_0 boost-lib
          Remove-Item boost.zip
          Set-Location C:\gcam-libs\boost-lib
          .\bootstrap.bat
          .\b2 --with-system --with-filesystem address-model=64 variant=release stage

          # ---- oneTBB (prebuilt Windows package) ----
          Set-Location $env:GITHUB_WORKSPACE
          curl.exe -fL -o tbb.zip https://github.com/oneapi-src/oneTBB/releases/download/v2021.13.0/oneapi-tbb-2021.13.0-win.zip
          Expand-Archive tbb.zip -DestinationPath C:\gcam-libs
          Rename-Item C:\gcam-libs\oneapi-tbb-2021.13.0 tbb
          Remove-Item tbb.zip

          # ---- Eigen (header-only) ----
          curl.exe -fL -o eigen.zip https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip
          Expand-Archive eigen.zip -DestinationPath C:\gcam-libs
          Rename-Item C:\gcam-libs\eigen-3.4.0 eigen
          Remove-Item eigen.zip

      - name: Set up libs folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force libs\java | Out-Null
          New-Item -ItemType Junction -Path libs\boost-lib -Target C:\gcam-libs\boost-lib
          New-Item -ItemType Junction -Path libs\tbb       -Target C:\gcam-libs\tbb
          New-Item -ItemType Junction -Path libs\eigen     -Target C:\gcam-libs\eigen
          New-Item -ItemType Junction -Path libs\java\include -Target "$env:JAVA_HOME\include"
          New-Item -ItemType Junction -Path libs\java\lib     -Target "$env:JAVA_HOME\lib"
          New-Item -ItemType Junction -Path libs\jars -Target "$env:USERPROFILE\gcam-libs\jars"

          # sanity checks — fail early
          if (-not (Test-Path libs\tbb\include\tbb\tbb.h))       { throw "tbb headers missing" }
          if (-not (Test-Path libs\boost-lib\boost\version.hpp)) { throw "boost headers missing" }
          if (-not (Test-Path libs\boost-lib\stage\lib))         { throw "boost compiled libs missing" }
          if (-not (Test-Path libs\java\include\jni.h))          { throw "jni.h missing" }

      # ---------- Builds ----------
      - name: Build GCAM (Linux)
        if: runner.os == 'Linux'
        id: build-linux
        shell: bash
        run: |
          set -eo pipefail
          BUILD_START=$(date +%s)
          cd cvs/objects/build/linux
          make gcam -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          BUILD_END=$(date +%s)
          echo "build_seconds=$((BUILD_END - BUILD_START))" >> "$GITHUB_OUTPUT"

      - name: Build GCAM (macOS)
        if: runner.os == 'macOS'
        id: build-macos
        shell: bash
        run: |
          set -eo pipefail
          BUILD_START=$(date +%s)
          xcodebuild -project cvs/objects/build/xcode3/objects.xcodeproj \
            -target objects \
            -configuration Release \
            ARCHS=$(uname -m) \
            ONLY_ACTIVE_ARCH=YES \
            CC="ccache clang" CXX="ccache clang++" \
            CLANG_ENABLE_MODULES=NO \
            build 2>&1 | tee build.log
          BUILD_END=$(date +%s)
          echo "build_seconds=$((BUILD_END - BUILD_START))" >> "$GITHUB_OUTPUT"

          # Xcode stages the product; normalize to exe/gcam.exe
          BIN=$(find exe/build -type f -name gcam -perm +111 | head -n 1)
          test -n "$BIN"
          cp "$BIN" exe/gcam.exe

      - name: Build GCAM (Windows)
        if: runner.os == 'Windows'
        id: build-win
        shell: bash
        run: |
          set -eo pipefail
          BUILD_START=$(date +%s)
          MSBuild.exe cvs/objects/build/vc10/objects.sln \
            -m -p:Configuration=Release -p:Platform=x64 2>&1 | tee build.log
          BUILD_END=$(date +%s)
          echo "build_seconds=$((BUILD_END - BUILD_START))" >> "$GITHUB_OUTPUT"

          # Runtime DLL needed next to the exe
          cp libs/tbb/redist/intel64/vc14/tbb12.dll exe/ || true

      # ---------- Verify & artifacts ----------
      - name: Verify executable
        shell: bash
        run: |
          ls -la exe/
          test -f exe/gcam.exe
          file exe/gcam.exe || true
          echo "Build artifact found"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: gcam-exe-${{ matrix.os }}-${{ github.run_number }}
          path: exe/gcam.exe
          retention-days: 14

      # ---------- Metrics ----------
      - name: Collect metrics
        if: always()
        shell: bash
        run: |
          END_TS=$(date +%s)
          TOTAL=$((END_TS - ${{ steps.start.outputs.start_ts }}))
          BUILD_SECS=${{ steps.build-linux.outputs.build_seconds || steps.build-macos.outputs.build_seconds || steps.build-win.outputs.build_seconds || 0 }}
          BINARY_SIZE=$(stat -c %s exe/gcam.exe 2>/dev/null || stat -f %z exe/gcam.exe 2>/dev/null || echo 0)
          WARNINGS=$(grep -ci "warning" build.log 2>/dev/null || echo 0)
          cat > metrics.json <<EOF
          {
            "os": "${{ matrix.os }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "date_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "total_workflow_seconds": $TOTAL,
            "build_seconds": $BUILD_SECS,
            "binary_size_bytes": $BINARY_SIZE,
            "compiler_warnings": $WARNINGS
          }
          EOF
          cat metrics.json
          {
            echo "### GCAM Build Metrics (${{ matrix.os }})"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Build time | ${BUILD_SECS}s |"
            echo "| Total time | ${TOTAL}s |"
            echo "| Binary size | ${BINARY_SIZE} bytes |"
            echo "| Warnings | ${WARNINGS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcam-metrics-${{ matrix.os }}-${{ github.run_number }}
          path: |
            metrics.json
            build.log
          retention-days: 9
